<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Vẽ Mượt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: white; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
        #grid { background-image: linear-gradient(#2a2a2a 1px, transparent 1px), linear-gradient(90deg, #2a2a2a 1px, transparent 1px); background-size: 30px 30px; }

        #controls { background: #1e1e1e; padding: 15px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; padding-bottom: 20px; }
        
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #2c2c2c; color: white; font-size: 14px; cursor: pointer; }
        .btn.active { background: #2e7d32; }
        
        /* Nút Xóa và Hoàn tác */
        .action-row { display: flex; gap: 8px; width: 100%; margin-top: 5px; }
        .btn-undo { background: #1976d2; flex: 1; }
        .btn-danger { background: #d32f2f; flex: 1; }
        
        input[type="range"] { flex: 1; margin: 0 10px; accent-color: #2196f3; }
        .val { width: 30px; text-align: right; font-size: 13px; color: #aaa; }
        
        .toggle-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; background: #2c2c2c; color: white; transition: 0.2s; }
        .toggle-btn.on { background: #2e7d32; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="grid"></canvas>
        <canvas id="draw"></canvas>
    </div>

    <div id="controls">
        <button id="toggleStraight" class="toggle-btn on">Giữ thẳng: BẬT</button>
        
        <div class="row">
            <span>Kiểu</span>
            <div class="btn-group">
                <button class="btn active" data-mode="auto">Tự động</button>
                <button class="btn" data-mode="h">Ngang</button>
                <button class="btn" data-mode="v">Dọc</button>
            </div>
        </div>

        <div class="row">
            <span>Độ nhạy khóa</span>
            <input type="range" id="sensitivity" min="0" max="45" value="12">
            <span class="val" id="sensVal">12°</span>
        </div>

        <div class="row">
            <span>Độ dày nét</span>
            <input type="range" id="lineWidth" min="1" max="20" value="4">
            <span class="val" id="widthVal">4</span>
        </div>

        <div class="action-row">
            <button id="undoBtn" class="btn btn-undo">↩ Hoàn tác</button>
            <button id="clearBtn" class="btn btn-danger">Xóa hết</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('draw');
            const ctx = canvas.getContext('2d');
            
            let isDrawing = false;
            let lastPoint = null;
            let straightenOn = true;
            let mode = 'auto';
            let sensitivity = 12;
            let lineWidth = 4;
            
            // Lưu trữ lịch sử nét vẽ để hoàn tác
            let history = []; 
            let currentStrokePoints = [];
            let startPoint = null;

            function setupCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                // Giữ lại hình cũ khi resize
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                // Khôi phục hình cũ
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            }
            setupCanvas();

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function startDrawing(e) {
                isDrawing = true;
                startPoint = getPos(e);
                lastPoint = startPoint;
                currentStrokePoints = [startPoint];
            }

            function draw(e) {
                if (!isDrawing) return;
                const currentPoint = getPos(e);
                
                // Vẽ trực tiếp ngay lập tức (không độ trễ)
                ctx.beginPath();
                ctx.strokeStyle = '#4caf50';
                ctx.lineWidth = lineWidth;
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(currentPoint.x, currentPoint.y);
                ctx.stroke();

                lastPoint = currentPoint;
                currentStrokePoints.push(currentPoint);
            }

            function endDrawing() {
                if (!isDrawing) return;
                isDrawing = false;
                
                if (currentStrokePoints.length > 2 && straightenOn) {
                    const endPoint = currentStrokePoints[currentStrokePoints.length - 1];
                    const dx = Math.abs(endPoint.x - startPoint.x);
                    const dy = Math.abs(endPoint.y - startPoint.y);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    let doStraight = false;
                    if (mode === 'h' && dx > dy) doStraight = true;
                    else if (mode === 'v' && dy > dx) doStraight = true;
                    else if (mode === 'auto') {
                        if (dx > dy && angle < sensitivity) doStraight = true;
                        if (dy > dx && (90 - angle) < sensitivity) doStraight = true;
                    }

                    if (doStraight) {
                        // Xóa nét vừa vẽ nguệch ngoạc và thay bằng nét thẳng
                        redrawAll(); // Vẽ lại toàn bộ lịch sử cũ trước
                        
                        ctx.beginPath();
                        ctx.strokeStyle = '#4caf50';
                        ctx.lineWidth = lineWidth;
                        ctx.moveTo(startPoint.x, startPoint.y);
                        
                        if (mode === 'h' || (mode === 'auto' && dx > dy)) {
                            let avgY = startPoint.y + (endPoint.y - startPoint.y) / 2;
                            ctx.lineTo(endPoint.x, avgY);
                            currentStrokePoints = [{x: startPoint.x, y: avgY}, {x: endPoint.x, y: avgY}];
                        } else {
                            let avgX = startPoint.x + (endPoint.x - startPoint.x) / 2;
                            ctx.lineTo(avgX, endPoint.y);
                            currentStrokePoints = [{x: avgX, y: startPoint.y}, {x: avgX, y: endPoint.y}];
                        }
                        ctx.stroke();
                    }
                }
                
                // Lưu nét vẽ vào lịch sử
                history.push([...currentStrokePoints]);
                currentStrokePoints = [];
            }

            function redrawAll() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#4caf50';
                ctx.lineWidth = lineWidth;
                history.forEach(stroke => {
                    if (stroke.length < 2) return;
                    ctx.beginPath();
                    ctx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) {
                        ctx.lineTo(stroke[i].x, stroke[i].y);
                    }
                    ctx.stroke();
                });
            }

            // Gắn sự kiện vẽ
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); endDrawing(); }, { passive: false });
            canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); endDrawing(); }, { passive: false });

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDrawing);

            // Xử lý nút bấm
            const toggleBtn = document.getElementById('toggleStraight');
            toggleBtn.onclick = function() {
                straightenOn = !straightenOn;
                this.classList.toggle('on', straightenOn);
                this.textContent = straightenOn ? 'Giữ thẳng: BẬT' : 'Giữ thẳng: TẮT';
            };

            document.querySelectorAll('[data-mode]').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    mode = this.dataset.mode;
                };
            });

            document.getElementById('sensitivity').oninput = function() {
                sensitivity = parseFloat(this.value);
                document.getElementById('sensVal').textContent = this.value + '°';
            };

            document.getElementById('lineWidth').oninput = function() {
                lineWidth = parseInt(this.value);
                document.getElementById('widthVal').textContent = this.value;
                // Cập nhật lại toàn bộ nét cũ theo độ dày mới (tuỳ chọn)
                redrawAll();
            };

            // Nút Hoàn tác (Undo)
            document.getElementById('undoBtn').onclick = function() {
                history.pop(); // Xóa nét vẽ cuối cùng
                redrawAll();   // Vẽ lại những nét còn lại
            };

            // Nút Xóa hết
            document.getElementById('clearBtn').onclick = function() {
                if (confirm('Xóa toàn bộ bản vẽ?')) {
                    history = [];
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            };
            
            // Chống đơ khi quay lại app
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    isDrawing = false;
                }
            });
            window.addEventListener('resize', setupCanvas);
        });
    </script>
</body>
</html>
