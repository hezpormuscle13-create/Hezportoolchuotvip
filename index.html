<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Vẽ Mượt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: white; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        
        #canvas-container { flex: 1; position: relative; background: #1a1a1a; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
        #grid { background-image: linear-gradient(#2a2a2a 1px, transparent 1px), linear-gradient(90deg, #2a2a2a 1px, transparent 1px); background-size: 30px 30px; }

        #controls { background: #1e1e1e; padding: 15px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #333; padding-bottom: 20px; }
        
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #2c2c2c; color: white; font-size: 14px; cursor: pointer; }
        .btn.active { background: #2e7d32; }
        .btn-danger { background: #d32f2f; width: 100%; margin-top: 5px; }
        
        input[type="range"] { flex: 1; margin: 0 10px; accent-color: #2196f3; }
        .val { width: 30px; text-align: right; font-size: 13px; color: #aaa; }
        
        .toggle-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; background: #2c2c2c; color: white; transition: 0.2s; }
        .toggle-btn.on { background: #2e7d32; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="grid"></canvas>
        <canvas id="draw"></canvas>
    </div>

    <div id="controls">
        <button id="toggleStraight" class="toggle-btn on">Giữ thẳng: BẬT</button>
        
        <div class="row">
            <span>Kiểu</span>
            <div class="btn-group">
                <button class="btn active" data-mode="auto">Tự động</button>
                <button class="btn" data-mode="h">Ngang</button>
                <button class="btn" data-mode="v">Dọc</button>
            </div>
        </div>

        <div class="row">
            <span>Độ nhạy khóa</span>
            <input type="range" id="sensitivity" min="0" max="45" value="12">
            <span class="val" id="sensVal">12°</span>
        </div>

        <div class="row">
            <span>Độ dày nét</span>
            <input type="range" id="lineWidth" min="1" max="20" value="4">
            <span class="val" id="widthVal">4</span>
        </div>

        <button id="clearBtn" class="btn btn-danger">Xóa hết</button>
    </div>

    <script>
        // Đưa toàn bộ code vào hàm init để dễ khởi tạo lại khi cần
        function initApp() {
            const canvas = document.getElementById('draw');
            const ctx = canvas.getContext('2d');
            
            let isDrawing = false;
            let points = [];
            let straightenOn = true;
            let mode = 'auto';
            let sensitivity = 12;
            let lineWidth = 4;

            function setupCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }
            setupCanvas();

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            // Reset trạng thái nếu có sự cố gián đoạn
            function resetState() {
                isDrawing = false;
                points = [];
            }

            canvas.addEventListener('touchstart', function(e) {
                e.preventDefault();
                isDrawing = true;
                points = [getPos(e)];
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                e.preventDefault();
                if (!isDrawing) return;
                const pos = getPos(e);
                points.push(pos);
                
                // Vẽ tạm
                ctx.strokeStyle = 'rgba(33, 150, 243, 0.5)';
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(points[points.length - 2].x, points[points.length - 2].y);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                e.preventDefault();
                if (!isDrawing) return;
                isDrawing = false;
                processDraw();
            }, { passive: false });
            
            // Chống kẹt khi đang vẽ mà bị hệ thống cắt ngang
            canvas.addEventListener('touchcancel', function(e) {
                resetState();
            }, { passive: false });

            // Sự kiện chuột
            canvas.addEventListener('mousedown', function(e) {
                isDrawing = true;
                points = [getPos(e)];
            });
            canvas.addEventListener('mousemove', function(e) {
                if (!isDrawing) return;
                points.push(getPos(e));
            });
            canvas.addEventListener('mouseup', function(e) {
                if (!isDrawing) return;
                isDrawing = false;
                processDraw();
            });

            function processDraw() {
                if (points.length < 2) return;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let start = points[0];
                let end = points[points.length - 1];
                
                let drawStart = start;
                let drawEnd = end;
                let doStraight = false;

                if (straightenOn) {
                    const dx = Math.abs(end.x - start.x);
                    const dy = Math.abs(end.y - start.y);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    if (mode === 'h' && dx > dy) doStraight = true;
                    else if (mode === 'v' && dy > dx) doStraight = true;
                    else if (mode === 'auto') {
                        if (dx > dy && angle < sensitivity) doStraight = true;
                        if (dy > dx && (90 - angle) < sensitivity) doStraight = true;
                    }

                    if (doStraight) {
                        if (mode === 'h' || (mode === 'auto' && dx > dy)) {
                            let avgY = start.y + (end.y - start.y) / 2;
                            drawEnd = { x: end.x, y: avgY };
                            drawStart = { x: start.x, y: avgY };
                        } else {
                            let avgX = start.x + (end.x - start.x) / 2;
                            drawEnd = { x: avgX, y: end.y };
                            drawStart = { x: avgX, y: start.y };
                        }
                    }
                }

                ctx.beginPath();
                ctx.strokeStyle = '#4caf50';
                ctx.lineWidth = lineWidth;
                ctx.moveTo(drawStart.x, drawStart.y);
                
                if (doStraight) {
                    ctx.lineTo(drawEnd.x, drawEnd.y);
                } else {
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length - 1; i++) {
                        const xc = (points[i].x + points[i + 1].x) / 2;
                        const yc = (points[i].y + points[i + 1].y) / 2;
                        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
                    }
                    ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
                }
                ctx.stroke();
                points = [];
            }

            // Gắn sự kiện nút bấm
            const toggleBtn = document.getElementById('toggleStraight');
            toggleBtn.onclick = function() {
                straightenOn = !straightenOn;
                this.classList.toggle('on', straightenOn);
                this.textContent = straightenOn ? 'Giữ thẳng: BẬT' : 'Giữ thẳng: TẮT';
            };

            document.querySelectorAll('[data-mode]').forEach(btn => {
                btn.onclick = function() {
                    document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    mode = this.dataset.mode;
                };
            });

            document.getElementById('sensitivity').oninput = function() {
                sensitivity = parseFloat(this.value);
                document.getElementById('sensVal').textContent = this.value + '°';
            };

            document.getElementById('lineWidth').oninput = function() {
                lineWidth = parseInt(this.value);
                document.getElementById('widthVal').textContent = this.value;
            };

            document.getElementById('clearBtn').onclick = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

            // LẮNG NGHE SỰ KIỆN QUAY LẠI APP (Chống đơ khi thoát ra vào lại)
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    resetState(); // Đánh thức, hủy trạng thái vẽ dở
                    setupCanvas(); // Căn chỉnh lại canvas cho chuẩn
                }
            });
            
            // Đánh thức khi màn hình xoay
            window.addEventListener('resize', setupCanvas);
        }

        // Khởi chạy khi trang đã tải xong hoàn toàn
        window.onload = initApp;
    </script>
</body>
</html>
